[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codepulse"
version = "0.1.0"
description = "A multi-language CLI that scans a project and reports on its health: structure, dependencies, git activity, docs, tests, and code smells — with an optional OpenRouter-powered summary."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = [
    "rich>=13.0.0",
]

[project.optional-dependencies]
llm = []
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.6.0"]

[project.scripts]
codepulse = "codepulse.cli:main"

[tool.setuptools.packages.find]
include = ["codepulse*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
